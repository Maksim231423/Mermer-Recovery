services:
  db:
    image: postgres:16-alpine
    container_name: mermer_postgres
    restart: always
    environment:
      POSTGRES_DB: mermer_creation
      POSTGRES_USER: mermer_creation
      POSTGRES_PASSWORD: mermer_strong_password_123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mermer_creation -d mermer_creation"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Mermer.Api/Dockerfile
    container_name: mermer_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=mermer_creation;Username=mermer_creation;Password=mermer_strong_password_123
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5050:5050"

volumes:
  pgdata: